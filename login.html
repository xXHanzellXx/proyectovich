<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Compras - Inicio de Sesión</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
        :root{
  --bg-main: #f8fafc;
  --bg-card: #ffffff;

  --primary: #2563eb;
  --primary-hover: #1d4ed8;

  --secondary: #64748b;

  --success: #16a34a;
  --danger: #dc2626;

  --border: #dbeafe;

  --text-main: #0f172a;
  --text-muted: #64748b;
}

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 17px;
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container-login {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--surface-dark);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .card h2 {
            font-size: 2.1rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #972323 0%, #24456d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        hr {
            border: none;
            height: 1px;
            background: var(--border-glow);
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: -10px;
            letter-spacing: 0.5px;
        }

        /* Input con diseño de icono integrado */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
        }

        .form-group input {
            background: var(--input-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 14px 16px 14px 42px;
            font-size: 1.05rem;
            color: #000000;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary-glow);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: #0284c7;
            text-decoration: underline;
        }
    </style>
    </head>
    <body>

        <div class="container-login">
            <div class="card">
                <h2>Entrar al Sistema</h2>
                <hr>
                <div class="form-group">
                    <label for="userLogin">Usuario:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="userLogin"
                            placeholder="Tu usuario">
                    </div>

                    <label for="passLogin">Contraseña:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="passLogin"
                            placeholder="••••••••">
                    </div>

                    <button class="btn-login" onclick="ejecutarLogin()">
                        <span>Ingresar Seguro</span>
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </button>
                </div>

                <p class="footer-text">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate
                        aquí</a>
                </p>
            </div>
        </div>

        <script>
async function ejecutarLogin() {
    const usuario = document.getElementById("userLogin").value;
    const password = document.getElementById("passLogin").value;

    if (!usuario || !password) {
        return alert("Por favor, completa todos los campos");
    }

    try {
        const res = await fetch("https://proyectovich.onrender.com/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({usuario, password})
        });

        const data = await res.json();

        if(res.ok) {
            localStorage.setItem("usuarioActual", JSON.stringify(data));
            window.location.href = "catalogo.html"; 
        } else {
            alert("Error: " + (data.error || "Credenciales incorrectas"));
        }
    } catch (error) {
        console.error("Error en el login:", error);
        alert("No se pudo conectar con el servidor backend.");
    }
}
</script>
    </body>
</html>
